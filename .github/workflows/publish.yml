name: Publish

# Publishing a GitHub release is the trigger, so cutting a release is the single action that
# ships a version. Nothing here holds an npm token: authentication is npm trusted publishing,
# which exchanges a short-lived GitHub OIDC token for publish rights. That is also why no 2FA
# prompt appears — there is no long-lived credential to protect.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for trusted publishing. Without it the OIDC exchange fails.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Build the tagged commit, not the branch head, so the provenance attestation
          # points at exactly what the release claims to ship.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: 22
          cache: npm
          # Deliberately NO registry-url. Setting it makes setup-node write an .npmrc
          # containing `_authToken=${NODE_AUTH_TOKEN}`; with no token configured — the whole
          # point of trusted publishing — that resolves to an empty string, npm treats the
          # package as authenticated-but-unauthorized, and never attempts the OIDC exchange.
          # It fails as a 404 on PUT, which looks like a missing package rather than an auth
          # problem. See actions/setup-node#1551. npm defaults to registry.npmjs.org anyway.

      # The npm bundled with Node 22 predates trusted publishing, which needs >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci
      - run: npm run build

      # The full matrix already ran on push; this is the last gate before something
      # irreversible. npm versions cannot be re-published once taken.
      - run: npm test

      - name: Verify the release tag matches the package version
        if: github.event_name == 'release'
        run: node scripts/check-version.mjs --tag "${{ github.event.release.tag_name }}"

      # npm reports every trusted-publishing misconfiguration as a 404 on PUT, which is
      # indistinguishable from a missing package (npm/cli#9088). These few lines separate
      # "the job cannot mint an OIDC token" from "npm rejected the token" from "a stray
      # credential suppressed the exchange". Values are redacted; only presence is reported.
      - name: Diagnose trusted publishing prerequisites
        run: |
          echo "npm $(npm --version), node $(node --version)"
          echo "registry: $(npm config get registry)"
          echo "userconfig: ${NPM_CONFIG_USERCONFIG:-<unset>}"
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            echo "--- userconfig, values redacted ---"
            sed -E 's/(_authToken|_auth|_password)=.*/\1=<redacted>/' "$NPM_CONFIG_USERCONFIG"
            echo "--- end ---"
            if grep -q "_authToken" "$NPM_CONFIG_USERCONFIG"; then
              echo "PROBLEM: an _authToken line is present; npm will use it instead of OIDC"
            else
              echo "no _authToken line, good"
            fi
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token minting available to this job: yes"
          else
            echo "OIDC token minting available to this job: NO — id-token: write is not in effect"
          fi

      # Provenance attestations are published automatically under trusted publishing.
      - run: npm publish
